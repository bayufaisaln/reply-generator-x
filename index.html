<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reply X</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Reply X">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Favicon Inline Logo X -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><path d='M68.2 22h11.5L54.6 50.7 84.1 89.7H61L42.9 66.1 22.2 89.7H10.7l26.9-30.7L9.3 22h23.7l16.3 21.6L68.2 22zm-4 60.9h6.4L29.3 28.5h-6.8l41.7 54.4z' fill='white'/></svg>">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #0f1419;
            --primary-dark: #272c30;
            --accent: #1d9bf0;
            --bg: #f7f9f9;
            --card: #ffffff;
            --text: #0f1419;
            --text-secondary: #536471;
            --border: #cfd9de;
            --danger: #f4212e;
            --success: #00ba7c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header { 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 12px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-x {
            width: 32px;
            height: 32px;
            background: #000000;
            color: #ffffff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
        }
        .header h1 { color: var(--primary); font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #eff3f4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }
        label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--text); }
        textarea {
            width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px;
            font-size: 15px; font-family: inherit; resize: vertical; min-height: 100px; 
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--text);
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 20, 25, 0.1); }
        .button-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        button {
            flex: 1; padding: 10px 16px; border: none; border-radius: 9999px; font-size: 14px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button:active { transform: scale(0.97); }
        .btn-secondary { background-color: #eff3f4; color: var(--text); }
        .btn-secondary:hover { background-color: #d7dbdc; }
        .btn-danger { background-color: #fee7e9; color: var(--danger); }
        .btn-danger:hover { background-color: #fdd2d5; }
        .btn-primary { 
            background-color: var(--primary); color: white; width: 100%; 
            padding: 14px; font-size: 16px; font-weight: 700; margin-top: 8px;
            box-shadow: 0 4px 10px rgba(15, 20, 25, 0.2);
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .hint { font-size: 12px; color: var(--text-secondary); margin-top: 10px; line-height: 1.4; }
        
        .option-card {
            background: #ffffff; border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; margin-bottom: 16px; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .option-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .option-label { font-size: 15px; font-weight: 800; color: var(--text); }
        .style-badge {
            font-size: 11px; font-weight: 700; color: #ffffff;
            background: var(--primary); padding: 4px 10px; border-radius: 9999px;
        }
        .style-badge.alt {
            background: var(--accent);
        }
        .option-text {
            font-size: 15px; line-height: 1.5; color: var(--text);
            white-space: pre-wrap; margin-bottom: 12px; word-break: break-word;
            background: #f7f9f9; padding: 14px; border-radius: 12px; border: 1px solid #eff3f4;
        }
        .btn-copy { background-color: var(--accent); color: white; width: 100%; padding: 12px; font-size: 14px; font-weight: 700; }
        .btn-copy:hover { background-color: #1a8cd8; }
        .btn-copy.copied { background-color: var(--success); }
        .action-row { display: flex; gap: 8px; }
        .btn-shuffle { background-color: #eff3f4; color: var(--text); flex: 0 0 auto; padding: 12px 16px; }
        .btn-shuffle:hover { background-color: #d7dbdc; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-x">𝕏</div>
        <h1>Reply X</h1>
    </div>

    <div class="card">
        <label for="inputText">Informasi Produk Shopee</label>
        <textarea id="inputText" placeholder="Tempel teks share produk dari Shopee di sini.."></textarea>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="pasteText()">Tempel</button>
            <button class="btn-danger" onclick="clearText()">Hapus</button>
        </div>
        <div class="hint">Tips: Tekan lama di area teks lalu pilih "Tempel" jika tombol otomatis tidak merespons.</div>
    </div>

    <button class="btn-primary" onclick="generateReply()">Generate Reply</button>

    <div id="outputContainer" style="margin-top: 22px; display: none;">
        
        <!-- POPULER: Kalimat Singkat Warga X -->
        <div class="option-card">
            <div class="option-header">
                <div class="option-label">Populer</div>
                <div class="style-badge alt">Singkat ala Warga X</div>
            </div>
            <div class="option-text" id="shortOutput"></div>
            <div class="action-row">
                <button class="btn-shuffle" onclick="shuffleShortReply()" title="Ganti kalimat singkat">Acak Lagi</button>
                <button class="btn-copy" id="btnCopyPopuler" onclick="copyOption('shortOutput', this)">Salin Populer</button>
            </div>
        </div>

        <!-- GAYA JUJUR: Kalimat Review + Nama Produk -->
        <div class="option-card">
            <div class="option-header">
                <div class="option-label">Gaya Jujur</div>
                <div class="style-badge" id="styleBadge">Worth It</div>
            </div>
            <div class="option-text" id="singleOutput"></div>
            <div class="action-row">
                <button class="btn-shuffle" onclick="shuffleJujurReply()" title="Ganti kalimat review">Acak Lagi</button>
                <button class="btn-copy" id="btnCopyJujur" onclick="copyOption('singleOutput', this)">Salin Gaya Jujur</button>
            </div>
        </div>

        <div class="hint" style="text-align: center; margin-top: 6px;">Tekan <b>Generate Reply</b> untuk mengacak keduanya, atau klik <b>Acak Lagi</b> pada kartu untuk mengganti salah satunya saja.</div>
    </div>

    <script>
        // Kategori 1: Gaya Jujur & Worth It (pembuka bervariasi)
        const templatesWorthIt = [
            "Kak, {product} ini asli worth it banget dan awet dipakai, coba cek di sini ya",
            "Jujur ya kak, {product} ini kualitasnya gak kaleng-kaleng buat harian, langsung cek di sini",
            "Izin rekomen kak, {product} ini bahannya bagus dan rapi banget, intip ke sini aja",
            "Eh kak, {product} ini beneran kepakai banget buat sehari-hari, cek detailnya di sini ya",
            "Permisi kak, {product} ini kualitasnya oke dan gak bikin nyesel, coba cek ke sini",
            "Spill dikit ya kak, {product} ini awet dan nyaman dipakai, ini linknya",
            "Aku pribadi suka banget sama {product} ini, bahannya enak dan harganya masuk akal, cek di sini",
            "Misi kak, buat yang lagi cari {product}, yang ini bagus banget kok, silakan intip",
            "Btw kak, {product} ini worth it parah buat harga segitu, coba cek di sini",
            "Kakak, {product} ini jahitannya rapi dan kualitasnya terasa banget, cek ya di sini",
            "Menurut aku sih {product} ini salah satu yang paling pas buat harian, langsung cek aja",
            "Rekomen banget nih kak, {product} ini gak nyesel beli, detailnya ada di sini",
            "{product} ini bagus banget kak, awet dan kepakai terus, coba cek di sini ya"
        ];

        // Kategori 2: Gaya Rating & Terlaris
        const templatesRating = [
            "Kak, izin spill {product} yang ulasannya bagus semua dan laris, cek di sini ya",
            "Cek deh kak, {product} di toko ini ratingnya tinggi dan gak mengecewakan",
            "Udah banyak yang buktikan kak, {product} ini bagus di review, coba intip ya",
            "Kak, {product} ini udah terjual banyak dengan testi positif semua, meluncur ke sini",
            "Misi kak, {product} ini review pembelinya bagus banget dan stoknya aman, silakan cek",
            "Ulasannya penuh bintang lima kak, {product} ini emang sebagus itu, cek di sini",
            "Terlaris nih kak, {product} ini banyak yang repeat order, intip di sini ya",
            "Izin share kak, {product} ini rating tokonya tinggi dan fotonya sesuai aslinya, cek ya",
            "Btw kak, {product} ini testinya bagus-bagus banget, bisa dibaca sendiri di sini",
            "Buat yang masih ragu kak, review {product} ini meyakinkan banget, coba lihat di sini",
            "Kak, banyak pembeli puas sama {product} ini, penjualnya juga fast respon, cek di sini",
            "{product} ini lagi laris kak dan ulasannya positif, link-nya di sini ya",
            "Pantengin ini kak, {product} dengan rating tinggi dan stok masih ready, cek aja"
        ];

        // Kategori 3: Gaya Racun Anak X
        const templatesRacun = [
            "Kak, {product} ini cakep banget aslinya dan lagi banyak yang incar, langsung cek ke sini",
            "Awas kepincut kak, {product} ini beneran sebagus itu pas dipakai, coba intip ya",
            "Mumpung masih ada kak, {product} yang lagi rame dicari ini, cek ke sini",
            "Hati-hati racun kak, {product} ini aslinya emang secakep itu, intip detailnya di sini",
            "Eh kak, {product} yang lagi banyak dicari ini stoknya masih aman, langsung cek aja",
            "Siap-siap checkout kak, {product} ini cakep parah dan gak pasaran, ini linknya",
            "Gemes banget kak sama {product} ini, aslinya lebih bagus dari fotonya, cek di sini",
            "Kaaak, {product} ini lagi hits banget, jangan sampai kehabisan ya, cek di sini",
            "Spill racun hari ini kak, {product} yang bikin susah nahan checkout, intip sini",
            "Lucu banget kak {product} ini, pantes banyak yang cari, coba lihat di sini",
            "Fix masuk keranjang kak, {product} ini cakep dan gak pasaran, cek link-nya",
            "Tuh kan kak, {product} ini emang racun, aslinya cakep banget, kepoin di sini",
            "Yang lagi cari {product} wajib lihat ini kak, cakep dan lagi diincar banyak orang"
        ];

        // Gaya Singkat Warga X (Sering dipakai di X / Menfess)
        const templatesShortX = [
            "kayak gini kah kak?",
            "itu kak modelnya lucuu dan cakep 😍😍",
            "bisa ambil ini kak, favorit akuu",
            "kaaa izin spill yaa",
            "mjb kak, coba cek ini 🤗🫶🏻",
            "ini coba kepoin seng",
            "mungkin yang ini kak? 🤍",
            "izin rekomen yang ini yaa kak 🙏🏻",
            "ini bukan sih kak yang dicari? 👀",
            "coba deh kak yang ini, aku juga suka 🥹",
            "mampir kak, ini lucu bangett 😭🫶🏻",
            "kak ini mirip banget, cek yaa 🤭",
            "minta tolong dicek kak, siapa tau cocok 🤍",
            "yang ini ready kak, aman 🫶🏻",
            "ini kak yang aku pakai, nyaman bangett ✨",
            "boleh intip yang ini kak, cakep banget 😍",
            "spill dikit yaa kak, ini linknya 🥰",
            "ada nih kak, coba lihat dulu 🤗",
            "cek ini dong kak, gak nyesel deh 🥺🤍",
            "semoga cocok yaa kak, ini linknya 🫶🏻",
            "sini kak aku bantu cariin, coba yang ini 🔍",
            "wahh ini sih cakep parah kak, intip dulu 😍😍",
            "kak coba ini deh, worth it banget 💯",
            "ini lagi viral kak, banyak yang cari 🔥",
            "coba cek ini yaa kak, siapa tau suka 🤍",
            "izin nyaranin ini yaa kak 🙏🏻✨",
            "nah ini kak, kayaknya yang kamu cari 🥰",
            "gasss kak, ini bagus bangett 😭",
            "ini racun banget sih kak, awas khilaf 🤭",
            "cek yang ini kak, favorit aku sejauh ini 🤍"
        ];

        let lastTemplate = '';
        let lastShortTemplate = '';
        let currentLink = 'https://s.shopee.co.id/xxxx';

        function getRandomTemplate(arr, isShort = false) {
            let pick;
            const last = isShort ? lastShortTemplate : lastTemplate;
            do {
                pick = arr[Math.floor(Math.random() * arr.length)];
            } while (pick === last && arr.length > 1);
            
            if (isShort) {
                lastShortTemplate = pick;
            } else {
                lastTemplate = pick;
            }
            return pick;
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputText').value = text;
            } catch (err) {
                alert('Gagal menempel otomatis. Silakan tekan lama di kolom teks lalu pilih Tempel.');
            }
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputContainer').style.display = 'none';
        }

        function extractProductInfo(input) {
            const linkMatch = input.match(/https?:\/\/[^\s]+/);
            const link = linkMatch ? linkMatch[0] : 'https://s.shopee.co.id/xxxx';

            let cleanText = input
                .replace(/\[.*?\]/g, '')       
                .replace(/\(.*?\)/g, '')       
                .replace(/https?:\/\/[^\s]+/g, '') 
                .replace(/dengan harga.*/i, '')    
                .replace(/Dapatkan di Shopee sekarang!/i, '') 
                .trim();

            let words = cleanText.split(/\s+/).filter(w => w.length > 0);
            
            if (words.length > 0 && (words[0].toLowerCase() === 'cek' || words[0].toLowerCase() === 'jual')) {
                words = words.slice(1);
            }
            
            const productName = words.slice(0, 5).join(' ') || 'produk pilihan';

            return { link, productName };
        }

        let currentProduct = 'produk pilihan';

        function buildJujurReply() {
            const style = Math.floor(Math.random() * 3) + 1;
            let sentence = '';
            let styleName = '';

            if (style === 1) {
                styleName = 'Worth It';
                sentence = getRandomTemplate(templatesWorthIt);
            } else if (style === 2) {
                styleName = 'Rating & Terlaris';
                sentence = getRandomTemplate(templatesRating);
            } else {
                styleName = 'Racun Anak X';
                sentence = getRandomTemplate(templatesRacun);
            }

            sentence = sentence.replace('{product}', currentProduct);
            document.getElementById('singleOutput').textContent = `${sentence}\n${currentLink}`;
            document.getElementById('styleBadge').textContent = styleName;
        }

        function buildPopulerReply() {
            const shortSentence = getRandomTemplate(templatesShortX, true);
            document.getElementById('shortOutput').textContent = `${shortSentence}\n${currentLink}`;
        }

        function generateReply() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('Silakan tempel atau ketik informasi produk terlebih dahulu!');
                return;
            }

            const info = extractProductInfo(input);
            currentLink = info.link;
            currentProduct = info.productName;

            buildPopulerReply();
            buildJujurReply();

            // Tampilkan hasil & reset tombol salin
            document.getElementById('outputContainer').style.display = 'block';
            resetCopyButton('btnCopyPopuler', 'Salin Populer');
            resetCopyButton('btnCopyJujur', 'Salin Gaya Jujur');

            document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function shuffleShortReply() {
            buildPopulerReply();
            resetCopyButton('btnCopyPopuler', 'Salin Populer');
        }

        function shuffleJujurReply() {
            buildJujurReply();
            resetCopyButton('btnCopyJujur', 'Salin Gaya Jujur');
        }

        function resetCopyButton(btnId, defaultText) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.textContent = defaultText;
                btn.classList.remove('copied');
            }
        }

        async function copyOption(elementId, btnElement) {
            const text = document.getElementById(elementId).textContent;
            const originalText = btnElement.id === 'btnCopyJujur' ? 'Salin Gaya Jujur' : 'Salin Populer';
            try {
                await navigator.clipboard.writeText(text);
                btnElement.textContent = 'Berhasil Disalin!';
                btnElement.classList.add('copied');
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.classList.remove('copied');
                }, 1500);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                btnElement.textContent = 'Berhasil Disalin!';
                btnElement.classList.add('copied');
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.classList.remove('copied');
                }, 1500);
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
